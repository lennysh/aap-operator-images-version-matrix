# Refresh AAP operator channel image data and generated markdown, then open a PR.
# Runs daily and on demand.
#
# Required repo secrets: REGISTRY_REDHAT_IO_USERNAME, REGISTRY_REDHAT_IO_PASSWORD
name: Update operator images matrix

on:
  workflow_dispatch:
    inputs:
      channels:
        description: Optional comma-separated channel list (leave empty to track every discovered channel)
        type: string
        required: false
        default: ""
      open_pull_request:
        description: Open a pull request with the changes
        type: boolean
        default: true
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-matrix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install podman and skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Ansible and PyYAML
        run: python -m pip install -r requirements.txt

      # Remembers each operator index digest so unchanged indexes are not pulled again.
      # A new cache entry is saved every run; the newest one is restored.
      - name: Restore operator index state
        uses: actions/cache@v6
        with:
          path: .cache/operator-index/state.yml
          key: operator-index-state-${{ github.run_id }}
          restore-keys: operator-index-state-

      - name: Log in to registry.redhat.io
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_REDHAT_IO_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${REGISTRY_USER}" || -z "${REGISTRY_PASSWORD}" ]]; then
            echo "::error::Set repository secrets REGISTRY_REDHAT_IO_USERNAME and REGISTRY_REDHAT_IO_PASSWORD (Red Hat registry service account)."
            exit 1
          fi
          echo "${REGISTRY_PASSWORD}" | podman login registry.redhat.io \
            --username "${REGISTRY_USER}" \
            --password-stdin
          podman login --get-login registry.redhat.io

      - name: Scrape operator channels and resolve image labels
        env:
          CHANNELS: ${{ inputs.channels }}
        run: |
          set -euo pipefail
          cmd=(ansible-playbook operator_images.yml)
          if [[ -n "${CHANNELS}" ]]; then
            json=$(python3 -c 'import json,sys; print(json.dumps({"aap_operator_images_channels": [c.strip() for c in sys.argv[1].split(",") if c.strip()]}))' "${CHANNELS}")
            cmd+=(-e "${json}")
          fi
          printf 'Running:'; printf ' %q' "${cmd[@]}"; printf '\n'
          "${cmd[@]}"

      - name: Regenerate markdown
        run: ansible-playbook md_generator.yml

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if git status --porcelain -- channels data README.md | grep -q .; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git status --short -- channels data README.md
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No matrix changes detected."
          fi

          # New CSVs (untracked vars files) and CSVs seen in additional indexes (modified vars files)
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/chore/update-matrix"
          new=$(git status --porcelain --untracked-files=all -- 'channels/*/vars/*.yml' \
            | awk -v base="${base}" '$1 == "??" {
                split($2, p, "/"); csv = p[4]; sub(/\.yml$/, "", csv)
                printf "| `%s` | [`%s`](%s/channels/%s/csvs/%s.md) |\n", p[2], csv, base, p[2], csv
              }' | sort)
          updated=$(git status --porcelain -- 'channels/*/vars/*.yml' | awk '$1 == "M"' | wc -l)
          {
            echo "summary<<EOF_SUMMARY"
            if [[ -n "${new}" ]]; then
              echo "### New CSVs"
              echo
              echo "| Channel | CSV |"
              echo "| --- | --- |"
              echo "${new}"
            else
              echo "No new CSVs."
            fi
            echo
            echo "Existing CSVs updated (e.g. seen in another operator index): ${updated}"
            echo "EOF_SUMMARY"
          } >> "${GITHUB_OUTPUT}"

      - name: Create pull request
        id: cpr
        if: ${{ (github.event_name == 'schedule' || inputs.open_pull_request) && steps.changes.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: refresh AAP operator images matrix

            Automated update via Update operator images matrix workflow.
          title: "chore: refresh AAP operator images matrix"
          body: |
            ## Summary
            Automated refresh of operator channel CSV image data, image labels, and generated markdown.

            | Option | Value |
            | --- | --- |
            | Trigger | `${{ github.event_name }}` |
            | `channels` | `${{ inputs.channels || '(all discovered channels)' }}` |

            ${{ steps.changes.outputs.summary }}

            ## Test plan
            - [ ] Spot-check new CSVs under `channels/*/vars/`
            - [ ] Confirm generated `channels/**/README.md` tables look correct
            - [ ] Merge when ready
          branch: chore/update-matrix
          delete-branch: true
          add-paths: |
            channels
            data
            README.md
